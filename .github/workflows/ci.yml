# Intégration continue : à chaque envoi de code, les tests et la construction doivent réussir.
name: Tests UMURAGE

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  serveur:
    name: Serveur (Django)
    runs-on: ubuntu-latest
    services:
      base:
        image: postgres:16
        env:
          POSTGRES_DB: umurage
          POSTGRES_USER: umurage
          POSTGRES_PASSWORD: umurage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umurage" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_DB: umurage
      POSTGRES_USER: umurage
      POSTGRES_PASSWORD: umurage
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Aucune migration oubliée
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL, comme en production, y compris les tests de concurrence)
        run: python manage.py test
      - name: Contrôles de sécurité du mode production
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: cle-de-test-uniquement-pour-l-integration-continue-0123456789
          DJANGO_ALLOWED_HOSTS: umurage.example.org
          UMURAGE_NUM_PROXIES: "1"
        run: python manage.py check --deploy --fail-level WARNING

  interface:
    name: Interface (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [serveur, interface]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t umurage:ci .
